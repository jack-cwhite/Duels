# How match results/stats are stored.
# SQL - uses whatever database.yml (in this same folder) points at.
# YAML - stores everything in stats.yml instead - no database needed, but doesn't scale to a large match history.
stats-storage: SQL

# How long (in seconds) a duel challenge stays pending before it expires and
# the challenger has to send it again. Set to 0 for challenges to never expire.
duel-request-expiry-time: 30

# How long (in seconds) players get to free-roam the arena and pick a kit
# before the fight actually starts. Must be at least 1. If an arena has no kits enabled this is
# just a countdown to the fight starting, bare-fisted.
kit-selection-time: 15

# When a duel starts, should the involved players have all other outstanding challenge requests removed.
# true - will cancel all challenge requests from other players for the two players who entered the duel
# false - all challenge requests will remain, expiry will still count down as normal
remove-outstanding-challenge-requests: true

# Whether a short grace period runs after kit selection, before the fight actually starts.
# During grace, players are in the arena with kits applied but cannot yet deal damage.
enable-grace-period: true

# How long (in seconds) the grace period lasts, if enabled above. Must be at least 1.
grace-period-seconds: 5

# After a match ends, block changes made inside the arena's bounds while it was
# in progress are automatically reverted before the arena can be reused. This
# caps how many changes are tracked per match - past this limit, further
# changes are simply not tracked (the match still ends normally, but the arena
# may be left partially changed). Must be at least 1.
arena-reset-max-tracked-block-changes: 4000

# How many of those tracked changes are reverted per server tick when a match
# ends. Reverting them all in a single tick can cause a noticeable stutter on
# arenas with a lot of destruction, so the work is spread out instead. Must be
# at least 1.
arena-reset-blocks-per-tick: 64

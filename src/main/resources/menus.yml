# Navigation items for menus.
# Previous, Next and Page Indicator are used only in paginated menus
# Back is used in all menus to return to the previous menu.
# Confirm and Cancel are used only by the "are you sure?" confirmation screen.
navigation:
  previous:
    material: ARROW
    name: '&aPrevious Page'
    lore:
      - '&7Go to the previous page.'
  next:
    material: ARROW
    name: '&aNext Page'
    lore:
      - '&7Go to the next page.'
  back:
    material: BARRIER
    name: '&7Back'
    lore:
      - '&7Return to the previous menu.'
  page-indicator:
    material: PAPER
    name: '&ePage {current}/{total}'
  confirm:
    material: LIME_WOOL
    name: '&aConfirm'
    lore:
      - '&7Click to confirm.'
  cancel:
    material: RED_WOOL
    name: '&cCancel'
    lore:
      - '&7Click to cancel.'

# Main menu for admin commands. This is the first menu that opens when a player runs /duels.
admin-main:
  title: '&8Duels - Main'
  rows: 1
  items:
    arena:
      slot: 3
      material: CHEST
      name: '&aArena Menu'
      lore:
        - '&7Manage arenas'
    kit:
      slot: 5
      material: DIAMOND_SWORD
      name: '&aKit Menu'
      lore:
        - '&7Manage kits'

# Main menu for interacting with arenas.
arena-main:
  title: '&8Duels - Arena'
  rows: 2
  items:
    list:
      slot: 3
      material: CHEST
      name: '&aList Arenas'
      lore:
        - '&7Click to browse and'
        - '&7manage arenas'
    create:
      slot: 5
      material: NETHER_STAR
      name: '&aCreate Arena'
      lore:
        - '&7First choose hand-built or dynamic.'
        - '&7Then name the arena in chat.'

arena-create-type:
  title: '&8Choose Arena Type'
  rows: 2
  items:
    static:
      slot: 2
      material: BRICKS
      name: '&aHand-built Arena'
      lore:
        - '&7Register one or more playable copies'
        - '&7in your existing worlds.'
        - '&7No structure capture needed.'
    dynamic:
      slot: 6
      material: STRUCTURE_BLOCK
      name: '&6Dynamic Arena'
      lore:
        - '&7Build one source, capture it,'
        - '&7then generate playable copies'
        - '&7in the dynamic arena world.'

# Paginated menu that lists all arenas. Clicking an arena opens the arena-detail menu for that arena.
arena-list:
  title: '&8Arenas'
  rows: 6
  entry:
    material: '{material}'
    name: '&f{arena-name}'
    lore:
      - '&7ID: &f{id}'
      - '&7Type: &f{mode}'
      - '&7{status}'
      - '&7Enabled: {enabled}'
      - '&eClick to manage'

# Menu for managing a specific arena. This menu is opened when an arena is clicked in the arena-list menu.
arena-detail:
  title: '&8{arena-name}'
  rows: 3
  items:
    toggle-available:
      slot: 8
      material: LIME_DYE
      name: '&aArena Enabled'
      lore:
        - '&7Players can be matched here.'
        - ''
        - '&7Click to disable this arena.'
      alternate-material: GRAY_DYE
      alternate-name: '&cArena Disabled'
      alternate-lore:
        - '&7No new duels will start here.'
        - ''
        - '&7Click to re-enable this arena.'
    rename:
      slot: 0
      material: NAME_TAG
      name: '&aChange Name'
      lore:
        - '&7Click, then type the arenas'
        - '&7new name in chat'
    instances:
      slot: 2
      material: EMERALD
      name: '&aInstances'
      lore:
        - '&7Click to view and manage'
        - '&7this arena''s registered'
        - '&7physical copies'
    create-instance:
      slot: 4
      material: NETHER_STAR
      name: '&aCreate Instance'
      lore:
        - '&7Click to register a new'
        - '&7physical copy of this arena'
    delete:
      slot: 6
      material: BARRIER
      name: '&cDelete Arena'
      lore:
        - '&7Click to permanently delete this arena'
    kits:
      slot: 10
      material: DIAMOND_SWORD
      name: '&bAllowed Kits'
      lore:
        - '&7Click to manage allowed'
        - '&7kits in this arena'
    boundary:
      slot: 12
      material: IRON_BARS
      name: '&bOut Of Bounds'
      lore:
        - '&7Mode: &f{mode}'
        - '&7Grace period: &f{grace}s'
        - ''
        - '&7SOFT_RETURN &8- &7pull the player back in'
        - '&7WARNING &8- &7only warn the player'
        - '&7FORFEIT &8- &7lose the duel after the grace period'
        - ''
        - '&7Left click to change mode'
        - '&7Right click to set the grace period'
    convert:
      slot: 14
      material: STRUCTURE_BLOCK
      name: '&6Convert to Dynamic'
      lore:
        - '&7Turns this arena into a DYNAMIC one:'
        - '&7one build source is captured as a'
        - '&7template, then copies are generated'
        - '&7and rebuilt automatically instead of'
        - '&7being hand-placed.'
        - '&7Your one copy becomes that source -'
        - '&7its spawns, bounds and blocks stay.'
        - '&eClick to review and confirm.'

arena-dynamic-detail:
  title: '&8{arena-name} - Dynamic'
  rows: 3
  items:
    rename:
      slot: 0
      material: NAME_TAG
      name: '&aChange Name'
    source:
      slot: 2
      material: STRUCTURE_BLOCK
      name: '&6Build Source'
      lore:
        - '&7Create or edit the one source build.'
        - '&7It never hosts a duel itself.'
    generated-copies:
      slot: 4
      material: EMERALD
      name: '&aGenerated Copies'
      lore:
        - '&7View and manage playable copies.'
        - ''
        - '&7Global slots: &f{occupied}/{maximum} &7occupied'
        - '&7Provisioning now: &f{reserved}'
        - '&7Available for new copies: &f{available}'
    delete:
      slot: 6
      material: BARRIER
      name: '&cDelete Arena'
    toggle-available:
      slot: 8
      material: LIME_DYE
      name: '&aArena Enabled'
      alternate-material: GRAY_DYE
      alternate-name: '&cArena Disabled'
    kits:
      slot: 10
      material: DIAMOND_SWORD
      name: '&bAllowed Kits'
    boundary:
      slot: 12
      material: IRON_BARS
      name: '&bOut Of Bounds'
      lore:
        - '&7Mode: &f{mode}'
        - '&7Grace period: &f{grace}s'
        - '&7Left click: change mode'
        - '&7Right click: set grace period'
    template:
      slot: 14
      material: FILLED_MAP
      name: '&6Captured Structure'
      lore:
        - '&7Status: {status}'
        - '&7Size: &f{size}'
        - ''
        - '&7Capture from the build source.'
        - '&7Left click for details.'
        - '&7Right click to clear if no copies remain.'

# Paginated menu listing the registered physical instances of one arena template.
arena-instance-list:
  title: '&8{arena-name} Instances'
  rows: 6
  entry:
    material: '{material}'
    name: '&f#{id}'
    lore:
      - '&7Spawn 1: {spawn1}'
      - '&7Spawn 2: {spawn2}'
      - '&7Ready: {ready}'
      - '&eClick to manage'

arena-generated-list:
  title: '&8{arena-name} Copies'
  rows: 6
  entry:
    material: '{material}'
    name: '&fCopy #{id}'
    lore:
      - '&7State: &f{health}'
      - '&7Slot: &f{slot}'
      - '&7Ready: {ready}'
      - '&eClick for status or retirement'

# Menu for managing a specific arena instance's spawns and bounds.
arena-instance-detail:
  title: '&8Build Source #{id} &7(Arena #{arenaId})'
  rows: 4
  items:
    spawn1:
      slot: 1
      material: EMERALD
      name: '&aSet Spawn 1'
      lore:
        - '&7Currently: &f{spawn1}'
        - ''
        - '&7Left Click to set spawn 1 to'
        - '&7your current location'
        - ''
        - '&7Right click to teleport to'
        - '&7currently set location'
    spawn2:
      slot: 3
      material: EMERALD
      name: '&aSet Spawn 2'
      lore:
        - '&7Currently: &f{spawn2}'
        - ''
        - '&7Left Click to set spawn 2 to'
        - '&7your current location'
        - ''
        - '&7Right click to teleport to'
        - '&7currently set location'
    edit-mode:
      slot: 19
      material: BLAZE_ROD
      name: '&eEnter Edit Mode'
      lore:
        - '&7Click to enter edit mode - gives'
        - '&7hotbar tools for setting spawns'
        - '&7bounds and structure corners in-world'
    delete:
      slot: 25
      material: BARRIER
      name: '&cDelete Source'
      lore:
        - '&7Click to permanently delete this instance'
    bounds1:
      slot: 5
      material: LAPIS_LAZULI
      name: '&bSet Bounds Corner 1'
      lore:
        - '&7Currently: &f{bounds1}'
        - ''
        - '&7Left click to set corner 1 to'
        - '&7your current location'
        - ''
        - '&7Right click to teleport to'
        - '&7currently set corner'
    bounds2:
      slot: 7
      material: LAPIS_LAZULI
      name: '&bSet Bounds Corner 2'
      lore:
        - '&7Currently: &f{bounds2}'
        - ''
        - '&7Left click to set corner 2 to'
        - '&7your current location'
        - ''
        - '&7Right click to teleport to'
        - '&7currently set corner'
    structure1:
      slot: 10
      material: ORANGE_CONCRETE
      name: '&6Structure Corner 1'
      lore:
        - '&7Current draft: &f{corner1}'
        - '&7Left click: set to where you stand'
        - '&7Right click: teleport there'
        - '&7Only needed to capture a DYNAMIC template'
    structure2:
      slot: 12
      material: YELLOW_CONCRETE
      name: '&eStructure Corner 2'
      lore:
        - '&7Current draft: &f{corner2}'
        - '&7Left click: set to where you stand'
        - '&7Right click: teleport there'
        - '&7Only needed to capture a DYNAMIC template'
    capture:
      slot: 14
      material: WRITABLE_BOOK
      name: '&6Capture Structure'
      lore:
        - '&7Saves the blocks inside both orange corners.'
        - '&7Requires both spawns and gameplay bounds'
        - '&7inside that capture box.'
        - '&7Generated copies must be retired'
        - '&7before recapturing.'
    setup-status:
      slot: 21
      material: BOOK
      name: '&bInstance Setup'
      lore:
        - '&7Origin: &f{origin}'
        - '&7State: &f{health}'
        - '&7Spawns: {spawnsStatus}'
        - '&7Gameplay bounds: {boundsStatus}'
        - '&7(for spectator confinement, boundary'
        - '&7rules and block rollback)'
        - '&7Structure corners: temporary capture draft'
        - '&7only needed for a dynamic template.'

arena-static-instance-detail:
  title: '&8Hand-built Copy #{id} &7(Arena #{arenaId})'
  rows: 3
  items:
    spawn1:
      slot: 1
      material: EMERALD
      name: '&aSet Spawn 1'
      lore:
        - '&7Currently: &f{spawn1}'
        - '&7Left click: set to your location'
        - '&7Right click: teleport there'
    spawn2:
      slot: 3
      material: EMERALD
      name: '&aSet Spawn 2'
      lore:
        - '&7Currently: &f{spawn2}'
        - '&7Left click: set to your location'
        - '&7Right click: teleport there'
    bounds1:
      slot: 5
      material: LAPIS_LAZULI
      name: '&bGameplay Bounds 1'
      lore:
        - '&7Current: &f{bounds1}'
        - '&7Left click: set to your location'
        - '&7Right click: teleport there'
    bounds2:
      slot: 7
      material: LAPIS_LAZULI
      name: '&bGameplay Bounds 2'
      lore:
        - '&7Current: &f{bounds2}'
        - '&7Left click: set to your location'
        - '&7Right click: teleport there'
    setup-status:
      slot: 10
      material: BOOK
      name: '&bCopy Setup'
      lore:
        - '&7Spawns: {spawnsStatus}'
        - '&7Gameplay bounds: {boundsStatus}'
        - '&7(spectators, boundary rules'
        - '&7and block rollback)'
    edit-mode:
      slot: 12
      material: BLAZE_ROD
      name: '&eEdit In World'
      lore:
        - '&7Gives spawn and gameplay bounds tools.'
    delete:
      slot: 14
      material: BARRIER
      name: '&cDelete Copy'

arena-generated-detail:
  title: '&8Generated Copy #{id} &7(Arena #{arenaId})'
  rows: 2
  items:
    setup-status:
      slot: 2
      material: BOOK
      name: '&bCopy Status'
      lore:
        - '&7State: &f{health}'
        - '&7Spawns: {spawnsStatus}'
        - '&7Gameplay bounds: {boundsStatus}'
      alternate-name: '&bCopy Status'
      alternate-lore:
        - '&7State: &a{health}'
        - '&7Spawns and bounds are set from the template.'
    retry:
      slot: 4
      material: RECOVERY_COMPASS
      name: '&eRetry Failed Copy'
      lore:
        - '&7Only for a FAILED generated copy.'
    delete:
      slot: 6
      material: BARRIER
      name: '&cRetire Copy'
      lore:
        - '&7Clear its slot and remove this copy.'

# Manage what kits are allowed in an arena
arena-kit:
  title: '&8{arena-name} Kits'
  rows: 6
  entry:
    material: '{material}'
    name: '&f{kit-name}'
    lore:
      - '&7ID: &f{id}'
      - '&7Allowed: {allowed}'

# Main menu for interacting with arenas.
kit-main:
  title: '&8Duels - Kit'
  rows: 2
  items:
    list:
      slot: 3
      material: DIAMOND_SWORD
      name: '&aList Kits'
      lore:
        - '&7Click to browse and'
        - '&7manage kits'
    create:
      slot: 5
      material: NETHER_STAR
      name: '&aCreate Kit'
      lore:
        - '&7Click and then type name'
        - '&7in chat to create kit'

# Leaderboard of the top duelists by wins, with the viewer's own win/loss
# record shown separately (built in code, not from an "entry" template here -
# each row needs that player's real head texture, which isn't something a
# config template can express). Clicking an entry shows that player's wins.
stats-leaderboard:
  title: '&8Top Duelists'
  rows: 6

# Paginated menu listing every duel currently being played. Clicking an entry
# starts spectating that duel. Entry items are built in code (player heads with
# live status and duration), so there is no 'entry' template here.
spectate-matches:
  title: '&8Live Duels'
  rows: 6

arena-selection:
  title: '&8Challenge {player}: Arena'
  rows: 6
  entry:
    material: '{material}'
    name: '&e{name}'
    lore:
      - '&7{description}'
      - '&7Mode: &f{mode}'
      - '&eClick to challenge in this arena'

# Paginated menu that lists all kits. Clicking a kit opens the kit-detail menu for that kit.
kit-list:
  title: '&8Kits'
  rows: 6
  entry:
    material: '{material}'
    name: '&f{kit-name}'
    lore:
      - '&7ID: &f{id}'

# Menu for managing a specific kit. This menu is opened when a kit is clicked in the kit-list menu.
kit-detail:
  title: '&8{kit-name}'
  rows: 2
  items:
    set-icon:
      slot: 0
      material: ITEM_FRAME
      name: '&eSet Icon'
      lore:
        - '&7Click while holding an item to'
        - '&7use it as this kit''s icon in'
        - '&7the kit list/selector menus.'
    rename:
      slot: 2
      material: NAME_TAG
      name: '&aChange Name'
      lore:
        - '&7Click, then type the kit''s'
        - '&7new name in chat.'
    edit:
      slot: 4
      material: STICK
      name: '&bEdit Kit'
      lore:
        - '&7Click to edit kit items.'
    delete:
      slot: 6
      material: BARRIER
      name: '&cDelete Kit'
      lore:
        - '&7Click to permanently delete this kit.'

# Paginated menu shown during kit selection. Left click selects a kit and right click previews it.
kit-selector:
  title: '&8Choose a Kit'
  rows: 6
  entry:
    material: '{material}'
    name: '&f{kit-name}'
    lore:
      - '&aLeft click to select kit'
      - '&eRight click to view kit'

# Read-only display of a kit's contents/armor/offhand, shown when a player picks a kit from kit-selector.
# Slots 0-35 mirror the kit's stored inventory contents, slots 38/39/40/41/43 show
# helmet/chestplate/leggings/boots/offhand - kept in sync with kit-edit's layout below.
kit-view:
  title: '&8{kit-name}'
  rows: 6

# Menu for editing the items of a specific kit. This menu is opened when the edit option is clicked in the kit-detail menu.
# Slots 0-35 are free-edit slots mirroring the kit's stored inventory contents 1:1 (slot N here
# is contents[N]). Row 4 holds a helmet/chestplate/leggings/boots/offhand "paperdoll" (slots
# 38/39/40/41/43), each restricted to the matching equipment type. Save is at
# the far right of row 4; the bottom row is reserved for Back navigation.
kit-edit:
  title: '&8{kit-name}'
  rows: 6
  items:
    save:
      slot: 44
      material: EMERALD
      name: '&aSave Kit'
      lore:
        - '&7Click to save changes to this kit.'

# Every message here supports & colour codes and {placeholder} substitution -
# the placeholders available for each message are named after what they show
# (e.g. {player}, {id}, {name}); core.prefix is prepended to single-line
# messages automatically. Help lists are sent as written so they stay tidy.
#
# On update, any message key that is new in this version is added to your file
# automatically; keys you have already edited are never overwritten, and your
# comments and layout are preserved.
#
# Lists are the one exception. The 'help' lists below are treated as yours, so
# once they exist they are left completely alone - which means help lines for
# commands added in a later version will NOT appear on their own. To pick up the
# current help text, delete the whole 'help:' block (under 'admin:' and/or
# 'duel:') and restart; it will be regenerated in full. Do this only if you
# haven't reworded those lines yourself, since regenerating replaces them.
#
# CLICKABLE BUTTONS
#
# Some messages can carry clickable buttons. Write a button's placeholder
# anywhere in the message text and it becomes a button in chat:
#
#   {challenge} {select} {accept} {deny} {kit} {rematch}
#   {spectate}  {leave}  {stats}  {opponent-stats} {top}
#
# What each button looks like and says on hover is yours to change, under
# 'duel.actions' below. What each button DOES is fixed in code - it runs or
# suggests the same /duel command a player could type - so a message file can
# never make somebody click a command you did not intend.
#
# Buttons only work in these messages: duel.help, duel.challenge-received,
# duel.no-pending, duel.match-win, duel.match-lose, duel.spectate-started,
# duel.spectate-no-matches and duel.rematch-received. Put one anywhere else and
# Duels warns you on startup, because players would just see the literal text
# "{accept}".
#
# A button whose command needs a player name ({opponent-stats}) is shown without
# a click if the message it is in does not know one. {spectate} and {leave} are
# hidden from anyone without the duels.spectate permission, and a help line that
# contains a button you cannot use is not printed at all.
#
# {rematch} disappears completely - including its help line - when
# 'rematch-expiry-time' is set to 0 in config.yml, so turning rematches off
# never leaves a button behind that could only say "rematches are disabled".
#
# To check an edit without arranging a real duel, run
# '/duels diagnostics buttons' in game. It prints every message that can carry
# buttons using sample data, then each button on its own with the exact command
# it would run.
core:
  prefix: '&8&l[&c&lDuels&8&l]'
  no-permission: '&cYou do not have permission to use this command!'
  player-only: '&cOnly players can use this command!'
  incorrect-usage: '&cIncorrect usage! Usage: {usage}'
  player-not-found: '&cCould not find a player with the name &e{player}&c!'


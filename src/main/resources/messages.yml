# Every message here supports & colour codes and {placeholder} substitution -
# the placeholders available for each message are named after what they show
# (e.g. {player}, {id}, {name}); core.prefix is prepended to single-line
# messages automatically. Help lists are sent as written so they stay tidy.
#
# On update, any message key that is new in this version is added to your file
# automatically; keys you have already edited are never overwritten, and your
# comments and layout are preserved.
#
# Lists are the one exception. The 'help' lists below are treated as yours, so
# once they exist they are left completely alone - which means help lines for
# commands added in a later version will NOT appear on their own. To pick up the
# current help text, delete the whole 'help:' block (under 'admin:' and/or
# 'duel:') and restart; it will be regenerated in full. Do this only if you
# haven't reworded those lines yourself, since regenerating replaces them.
core:
  prefix: '&8&l[&c&lDuels&8&l]'
  no-permission: '&cYou do not have permission to use this command!'
  player-only: '&cOnly players can use this command!'
  incorrect-usage: '&cIncorrect usage! Usage: {usage}'
  player-not-found: '&cCould not find a player with the name &e{player}&c!'


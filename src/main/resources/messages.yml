  arena-kit-toggled: '&7Kit &e{kitId} &7is now &e{status} &7for arena &e{id}'
  arena-edit-mode-exited: '&7You have exited arena edit mode'
  arena-structure-corner-set: '&7Structure capture corner &e{corner} &7set. These orange/yellow corners are separate from the aqua gameplay bounds.'

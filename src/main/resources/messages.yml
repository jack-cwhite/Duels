# Every message here supports & colour codes and {placeholder} substitution -
# the placeholders available for each message are named after what they show
# (e.g. {player}, {id}, {name}); core.prefix is prepended to single-line
# messages automatically. Help lists are sent as written so they stay tidy.
core:
  prefix: '&8&l[&c&lDuels&8&l]'
  no-permission: '&cYou do not have permission to use this command!'
  player-only: '&cOnly players can use this command!'
  incorrect-usage: '&cIncorrect usage! Usage: {usage}'
  player-not-found: '&cCould not find a player with the name {player}!'

admin:
  no-arenas: '&cThere are no arenas set up yet. Use /duels arena create <name> to make one'
  arena-created: '&7Arena &acreated &7with name: &e{name} &7and ID: &e{id}'
  arena-deleted: '&7Arena with ID: &e{id} has been &cdeleted'
  arena-not-found: '&cAn arena with ID: &e{id} &ccould not be found'
  arena-spawn-set: '&7Spawn &e{spawn} &7set for arena &e{id}'
  arena-spawn-not-set: '&cSpawn &e{spawn} &chas not been set for arena &e{id}'
  arena-invalid-spawn: '&cSpawn number must be &e1 &cor &e2&c, got: &e{spawn}'
  arena-renamed: '&7Arena &e{id} &7renamed to &e{name}'
  arena-list-entry: '&e#{id} {name} &7- Spawn 1: &e{spawn1} &7Spawn 2: &e{spawn2} &7Ready: &e{ready} &7Available: &e{available}'
  arena-enabled: '&7Arena with ID: &e{id} &7has been &aenabled'
  arena-disabled: '&7Arena with ID: &e{id} &7has been &cdisabled'
  arena-in-use: '&cArena with ID: &e{id} &cis currently hosting a match and cannot be edited or deleted'
  kit-created: '&7Kit &acreated &7with name: &e{name} &7and ID: &e{id}'
  kit-deleted: '&7Kit with ID: &e{id} &7has been &cdeleted'
  kit-not-found: '&cA kit with ID: &e{id} &7could not be found'
  kit-renamed: '&7Kit &e{id} &7renamed to &e{name}'
  kit-saved: '&7Kit items for kit with ID: &e{id} &7have been saved'
  kit-icon-set: '&7Icon for kit &e{name} &7has been &aset'
  kit-icon-empty-hand: '&cHold the item you want as this kit''s icon first'
  no-kits: '&cThere are no kits set up yet. Use /duels kit create <name> to make one'
  kit-list-entry: '&e#{id} &7{name}'
  help:
    - '&e/duels arena [id] &7- open arena management or a specific arena'
    - '&e/duels arena create <name> &7- create an arena with the specified name'
    - '&e/duels arena delete <id> &7- delete the arena with the specified id'
    - '&e/duels arena list &7- list all arenas'
    - '&e/duels arena setspawn <id> <1|2> &7- set a spawn point for an arena'
    - '&e/duels kit create <name> &7- create a kit with the specified name'
    - '&e/duels kit [id] &7- open kit management or a specific kit'
    - '&e/duels kit delete <id> &7- delete the kit with the specified id'
    - '&e/duels kit list &7- list all kits'

duel:
  help:
    - '&e/duel <player> &7- challenge a player to a duel'
    - '&e/duel accept &7- accept a pending challenge'
    - '&e/duel deny &7- decline a pending challenge'
    - '&e/duel kit &7- reopen the kit selection menu mid-match'
    - '&e/duel top &7- view the top duelists by wins'
  cannot-challenge-self: '&cYou cannot challenge yourself to a duel!'
  already-pending: '&cYou already have a pending challenge with {player}'
  challenge-sent: '&7You have challenged &e{player} &7to a duel! It will expire in &e{expiry}'
  challenge-received: '&e{player} &7has challenged you to a duel! Use &e/duel &7accept or &e/duel deny'
  no-pending: '&cYou have no pending challenge to respond to!'
  accepted: '&7You &aaccepted &e{player}''s &7duel challenge'
  accepted-opponent: '&e{player} &aaccepted &7your duel challenge'
  declined: '&7You &cdeclined &e{player}''s &7duel challenge'
  declined-opponent: '&e{player} &cdeclined &7your duel challenge'
  cancelled-disconnect: '&7Your duel challenge with &e{player} &7was &ccancelled &7because they disconnected'
  kit-selected: '&7You selected the &e''{name}'' &7kit'
  not-in-duel: '&cYou are not currently in a duel!'
  kit-selection-closed: '&cKit selection is not currently open!'
  stats-load-failed: '&cYour duel statistics could not be loaded. Please try again later.'
  no-kits-allowed: '&7No kits are enabled in this arena - this will be a bare-fisted duel!'
  player-record: '&e{player} &7has &a{wins} &7wins.'
  challenge-expired: '&7Your duel challenge to &e{player} has &cexpired!'
  no-arena-available: '&cNo arenas are available right now. Try again in a moment.'
  already-in-match: '&cYou are already in a duel!'
  target-in-match: '&c{player} is already in a duel!'
  match-start: '&7Fight! Defeat &e{player} to win the duel!'
  match-win: '&aYou won the duel against &e{player}'
  match-lose: '&cYou lost the duel against &e{player}'

menu:
  arena-create-prompt: '&7Type the new arena''s name in chat.'
  arena-rename-prompt: '&7Type the arena''s new name in chat.'
  kit-create-prompt: '&7Type the new kit''s name in chat.'
  kit-rename-prompt: '&7Type the kit''s new name in chat.'
  invalid-name: '&cThat name is not valid. Try again.'
  input-cancelled: '&7Naming cancelled.'

player:
  state-restored: '&7Your inventory from before a server restart has been restored.'

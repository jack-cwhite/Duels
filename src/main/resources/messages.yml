    - '&e/duels arena allowkit <id> <kitId> &7- toggle whether a kit is allowed in an arena'
    - '&e/duels arena instance create <arenaId> &7- register a hand-built STATIC copy'
    - '&e/duels arena instance delete <instanceId> &7- delete an arena instance'
    - '&e/duels arena instance list <arenaId> &7- list an arena''s registered instances'
    - '&e/duels arena instance setspawn <instanceId> <1|2> &7- set a spawn point for an arena instance'
    - '&e/duels arena instance bounds <instanceId> <1|2> &7- set a bounds corner for an arena instance'
    - '&e/duels arena instance editmode <instanceId> &7- enter arena edit mode for an arena instance'
    - '&e/duels kit create <name> &7- create a kit with the specified name'

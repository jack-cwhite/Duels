name: Duels
version: '${project.version}'
main: me.jackcw.duels.Duels
api-version: '1.21'
description: 1v1 duels with configurable kits and arenas
author: Jack

commands:
  duels:
    description: Main admin command
    usage: /<command>
    aliases:
      - ds
  duel:
    description: Challenge another player to a duel
    usage: /<command> <player>
    aliases:
      - fight

permissions:
  duels.duel:
    description: Challenge, accept, deny, and view duel statistics
    default: true
  duels.spectate:
    description: Watch live duels
    default: true
  duels.admin:
    description: Full access to every Duels admin command
    default: op
    children:
      duels.admin.help: true
      duels.admin.arena: true
      duels.admin.kit: true
      duels.admin.diagnostics: true
      duels.admin.rewards: true
      duels.admin.reload: true
  duels.admin.diagnostics:
    description: Inspect Duels' live internal state
    default: op
  duels.admin.rewards:
    description: Inspect rewards.yml and preview what a result would pay
    default: op
  duels.admin.reload:
    description: Reload config.yml and messages.yml without restarting the server
    default: op
  duels.admin.help:
    description: Open the Duels admin menu
    default: op
  duels.admin.arena:
    description: Access the arena management menu and its subcommands
    default: op
    children:
      duels.admin.arena.create: true
      duels.admin.arena.delete: true
      duels.admin.arena.list: true
      duels.admin.arena.menu: true
      duels.admin.arena.setspawn: true
      duels.admin.arena.rename: true
      duels.admin.arena.toggle: true
      duels.admin.arena.bounds: true
      duels.admin.arena.boundary: true
      duels.admin.arena.instance: true
      duels.admin.arena.editmode: true
      duels.admin.arena.allowkit: true
      duels.admin.arena.provisioning: true
      duels.admin.arena.template: true
  duels.admin.arena.create:
    description: Create arenas
    default: op
  duels.admin.arena.delete:
    description: Delete arenas
    default: op
  duels.admin.arena.list:
    description: List arenas and their spawn/ready status
    default: op
  duels.admin.arena.menu:
    description: Open the arena management menu
    default: op
  duels.admin.arena.setspawn:
    description: Set arena spawn points
    default: op
  duels.admin.arena.rename:
    description: Rename arenas
    default: op
  duels.admin.arena.toggle:
    description: Toggle an arena enabled/disabled
    default: op
  duels.admin.arena.bounds:
    description: Set arena bounds corners
    default: op
  duels.admin.arena.boundary:
    description: Set an arena's out-of-bounds behaviour and grace period
    default: op
  duels.admin.arena.editmode:
    description: Enter arena edit mode
    default: op
  duels.admin.arena.instance.retry:
    description: Retry a failed provisioned arena instance
    default: op
  duels.admin.arena.allowkit:
    description: Toggle whether a kit is allowed in an arena
    default: op
  duels.admin.arena.provisioning:
    description: Set an arena's static or dynamic provisioning mode
    default: op
  duels.admin.arena.template:
    description: Inspect and manage captured dynamic arena templates
    default: op
    children:
      duels.admin.arena.template.capture: true
      duels.admin.arena.template.info: true
      duels.admin.arena.template.clear: true
  duels.admin.arena.template.capture:
    description: Capture a Paper structure template from an arena edit session
    default: op
  duels.admin.arena.template.info:
    description: Inspect captured arena template metadata
    default: op
  duels.admin.arena.template.clear:
    description: Remove an unused captured arena template
    default: op
  duels.admin.kit:
    description: Access the kit management menu and its subcommands
    default: op
    children:
      duels.admin.kit.create: true
      duels.admin.kit.delete: true
      duels.admin.kit.list: true
      duels.admin.kit.menu: true
      duels.admin.kit.rename: true
      duels.admin.kit.icon: true
      duels.admin.kit.edit: true
  duels.admin.kit.create:
    description: Create kits
    default: op
  duels.admin.kit.delete:
    description: Delete kits
    default: op
  duels.admin.kit.list:
    description: List kits
    default: op
  duels.admin.kit.menu:
    description: Open the kit management menu
    default: op
  duels.admin.kit.rename:
    description: Rename kits
    default: op
  duels.admin.kit.icon:
    description: Set a kit's icon from the held item
    default: op
  duels.admin.kit.edit:
    description: Open a kit's item editor directly
    default: op
